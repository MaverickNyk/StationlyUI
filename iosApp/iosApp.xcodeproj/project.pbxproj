		924B5C1B070681E0A9B85219 /* Select Kotlin XCFramework */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Select Kotlin XCFramework";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -e\nXCF_DIR=\"${SRCROOT}/../composeApp/build/XCFrameworks\"\nWANT=\"${STATIONLY_KOTLIN_BUILD}\"\n# A Release configuration must never link the debug framework. This\n# cannot happen through the intended path — project.yml sets\n# STATIONLY_KOTLIN_BUILD=release for both Release configs — but that\n# assignment LOOKS like a duplicate of the one in Base.xcconfig and is\n# exactly the kind of thing a tidy-up deletes. It is not a duplicate:\n# Base.xcconfig is a PROJECT-level xcconfig and project-level\n# `settings:` beat it, which is what makes the override work at all.\n#\n# Delete it and every archive silently ships unoptimised debug Kotlin\n# built from a different Gradle variant, with a green build and no\n# warning. Failing here makes that a thirty-second fix instead of a\n# TestFlight mystery.\ncase \"${CONFIGURATION}\" in\n  Release*)\n    if [ \"${WANT}\" != \"release\" ]; then\n      echo \"error: ${CONFIGURATION} would link the '${WANT}' Kotlin framework.\"\n      echo \"  STATIONLY_KOTLIN_BUILD must be 'release' for any Release configuration.\"\n      echo \"  Check project.yml still sets it under settings.configs for Release Staging\"\n      echo \"  and Release Production — that override BEATS Base.xcconfig by design.\"\n      exit 1\n    fi ;;\nesac\nif [ ! -d \"${XCF_DIR}/${WANT}/composeApp.xcframework\" ]; then\n  echo \"error: ${WANT} XCFramework missing. Run: ./gradlew :composeApp:assembleComposeApp$(echo ${WANT} | tr '[:lower:]' '[:upper:]' | cut -c1)$(echo ${WANT} | cut -c2-)XCFramework\"\n  exit 1\nfi\n# -n so an existing symlink is replaced rather than followed (which\n# would nest the new link INSIDE the old target's directory).\n#\n# NOTE this symlink is shared mutable state across concurrent builds:\n# two xcodebuild invocations on different configurations (two Xcode\n# windows, or a script running alongside the GUI) race here, and the\n# loser links whatever the winner selected. Builds are sequential in\n# practice and the archive verification in scripts/ios-testflight.sh\n# asserts the outcome, so this is recorded rather than solved — the\n# real fix needs per-configuration framework paths, which XcodeGen\n# cannot express (Xcode does not expand build settings inside a file\n# reference, which is why this is a symlink in the first place).\nln -sfn \"${WANT}\" \"${XCF_DIR}/current\"\necho \"Kotlin XCFramework: ${WANT}\"\n";
		};
