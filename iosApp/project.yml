name: iosApp
options:
  bundleIdPrefix: com.stationly
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  indentWidth: 4
  tabWidth: 4
  createIntermediateGroups: true

configs:
  Debug Staging: debug
  Debug Production: debug
  Release Staging: release
  Release Production: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "10.28.1"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
        excludes:
          - "**/*.entitlements"
    info:
      path: iosApp/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: "Stationly uses your location to show nearby stops."
        StationlyEnvironment: $(STATIONLY_ENVIRONMENT)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.48865967804-g7alcuuk9ld0m7e3vugcc4jnscfl54qg
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stationly.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stationly.mobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        FRAMEWORK_SEARCH_PATHS: $(inherited)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6D3CXG8U25
        STATIONLY_ENVIRONMENT: production
      configs:
        Debug Staging:
          STATIONLY_ENVIRONMENT: staging
        Release Staging:
          STATIONLY_ENVIRONMENT: staging
        Debug Production:
          STATIONLY_ENVIRONMENT: production
        Release Production:
          STATIONLY_ENVIRONMENT: production
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - framework: ../composeApp/build/XCFrameworks/debug/composeApp.xcframework
        embed: true
      - target: StationlyWidget
        embed: true

  StationlyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StationlyWidget
        excludes:
          - "**/*.entitlements"
    info:
      path: StationlyWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StationlyWidget/StationlyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stationly.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stationly.mobile.StationlyWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_ENTITLEMENTS: StationlyWidget/StationlyWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6D3CXG8U25
        STATIONLY_ENVIRONMENT: production
      configs:
        Debug Staging:
          STATIONLY_ENVIRONMENT: staging
        Release Staging:
          STATIONLY_ENVIRONMENT: staging
        Debug Production:
          STATIONLY_ENVIRONMENT: production
        Release Production:
          STATIONLY_ENVIRONMENT: production
