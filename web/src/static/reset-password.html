<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Stationly</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #0A0A0A;
    border: 1px solid #1C1C1C;
    border-radius: 24px;
    overflow: hidden;
  }
  .top-bar { height: 3px; background: linear-gradient(90deg, #CC8800, #FFB81C 50%, #CC8800); }
  .body { padding: 40px 36px 44px; }
  .logo {
    font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
    margin-bottom: 28px; text-align: center;
  }
  .logo span { color: #FFB81C; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15; margin-bottom: 8px; }
  h1 em { color: #FFB81C; font-style: normal; }
  .sub { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #555; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
  input {
    width: 100%; padding: 14px 16px; background: #111; border: 1px solid #2A2A2A;
    border-radius: 12px; color: #fff; font-size: 15px; outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #FFB81C; }
  input.error { border-color: #E91E63; }
  .field-error { color: #F06292; font-size: 12px; margin-top: 6px; }
  .btn {
    width: 100%; padding: 16px; background: #FFB81C; color: #000;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 800;
    cursor: pointer; margin-top: 8px; transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:not(:disabled):hover { opacity: 0.9; }
  .error-banner {
    background: rgba(233,30,99,0.08); border: 1px solid rgba(233,30,99,0.2);
    border-radius: 10px; padding: 12px 14px; color: #F06292;
    font-size: 13px; line-height: 1.5; margin-bottom: 16px; display: none;
  }
  /* Success state */
  .success-state { text-align: center; display: none; }
  .success-icon { font-size: 48px; margin-bottom: 16px; }
  .success-state h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .success-state p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
  .open-app-btn {
    display: inline-block; padding: 16px 40px; background: #FFB81C; color: #000;
    border-radius: 14px; font-weight: 800; font-size: 15px; text-decoration: none; cursor: pointer;
    border: none;
  }
  .bottom-bar { height: 3px; background: linear-gradient(90deg, #1C1C1C, #FFB81C 50%, #1C1C1C); }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar"></div>
  <div class="body">

    <div class="logo">STATI<span>ONLY</span></div>

    <!-- Reset form -->
    <div id="form-state">
      <h1>Set your<br/><em>new password.</em></h1>
      <p class="sub">Choose something memorable — and please, not your birthday.</p>

      <div id="error-banner" class="error-banner"></div>

      <div class="field">
        <label>New password</label>
        <input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password">
        <div id="password-error" class="field-error"></div>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input id="confirm" type="password" placeholder="Same again" autocomplete="new-password">
        <div id="confirm-error" class="field-error"></div>
      </div>

      <button class="btn" id="submit-btn" onclick="handleSubmit()">Reset Password</button>
    </div>

    <!-- Success state -->
    <div id="success-state" class="success-state">
      <div class="success-icon">✅</div>
      <h2>Password updated.</h2>
      <p>You're all set. Open Stationly and sign in with your new password.</p>
      <button class="open-app-btn" onclick="openApp()">Open Stationly</button>
    </div>

  </div>
  <div class="bottom-bar"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, confirmPasswordReset, verifyPasswordResetCode }
    from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  // Firebase config — replace with your project values
  const app = initializeApp({
    apiKey:            window.__FIREBASE_API_KEY__            || 'YOUR_API_KEY',
    authDomain:        window.__FIREBASE_AUTH_DOMAIN__        || 'YOUR_AUTH_DOMAIN',
    projectId:         window.__FIREBASE_PROJECT_ID__         || 'YOUR_PROJECT_ID',
    storageBucket:     window.__FIREBASE_STORAGE_BUCKET__     || 'YOUR_STORAGE_BUCKET',
    messagingSenderId: window.__FIREBASE_MESSAGING_SENDER_ID__|| 'YOUR_SENDER_ID',
    appId:             window.__FIREBASE_APP_ID__             || 'YOUR_APP_ID',
  });
  const auth = getAuth(app);

  const params   = new URLSearchParams(window.location.search);
  const oobCode  = params.get('oobCode') || '';

  if (!oobCode) {
    showError('This reset link is invalid or has expired. Please request a new one from the app.');
    document.getElementById('submit-btn').disabled = true;
  }

  window.handleSubmit = async function () {
    const pwd     = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    clearErrors();

    if (pwd.length < 6) {
      fieldError('password', 'Password must be at least 6 characters');
      return;
    }
    if (pwd !== confirm) {
      fieldError('confirm', "Passwords don't match");
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Updating…';

    try {
      await confirmPasswordReset(auth, oobCode, pwd);
      document.getElementById('form-state').style.display    = 'none';
      document.getElementById('success-state').style.display = 'block';
    } catch (err) {
      btn.disabled    = false;
      btn.textContent = 'Reset Password';
      if (err.code === 'auth/expired-action-code' || err.code === 'auth/invalid-action-code') {
        showError('This reset link has expired or already been used. Please request a new one from the app.');
      } else {
        showError('Something went wrong. Please try again or contact support@stationly.co.uk');
      }
    }
  };

  window.openApp = function () {
    window.location = 'stationly://';
    setTimeout(() => { window.location = 'https://stationly.co.uk'; }, 1500);
  };

  function showError(msg) {
    const el = document.getElementById('error-banner');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function fieldError(id, msg) {
    document.getElementById(id).classList.add('error');
    document.getElementById(id + '-error').textContent = msg;
  }
  function clearErrors() {
    document.getElementById('error-banner').style.display = 'none';
    ['password', 'confirm'].forEach(id => {
      document.getElementById(id).classList.remove('error');
      document.getElementById(id + '-error').textContent = '';
    });
  }
</script>
</body>
</html>
