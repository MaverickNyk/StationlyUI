# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# Android settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin settings
kotlin.code.style=official

# KMP settings
kotlin.mpp.enableCInteropCommonization=true
# kotlin.native.cacheKind=none  ← REMOVED 2026-08-02, measured, keeping it off.
# Added incidentally in 8a20501 (an env-variants commit that never mentions
# caching), it disabled the Kotlin/Native compilation cache and recompiled every
# dependency — Compose included — on every link.
#   device link, incremental:  180s   → 58s
#   XCFramework, incremental:  ~360-420s → 70-100s
# The FIRST build after re-enabling is slower (~500s) while the cache is built,
# and again per target; only the third build shows the real number. Wiping
# ~/.konan or build/ pays that cost again. Do not re-add without measuring.
