# Project-wide Gradle settings
#
# 4g, raised from 2048m on 2026-08-15. The Kotlin/Native compiler runs IN the
# Gradle daemon, and `linkReleaseFrameworkIosArm64` — the release XCFramework
# link, which no one had ever run before that date — died with
# `java.lang.OutOfMemoryError: Java heap space` after 9 minutes at 2048m.
# Release linking optimises across the whole program, so it needs several times
# the heap of the debug link that had always been used for device builds; the
# debug path never came close to the old ceiling, which is why this sat
# undiscovered until the first TestFlight archive.
#
# 4g and not more because this machine has 8 GB of RAM total and xcodebuild
# runs right after the Gradle step. If the release link OOMs again, prefer
# `org.gradle.parallel=false` for that invocation over raising this further —
# past ~half of physical RAM the daemon starts losing to swap and gets slower,
# not more capable.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# Android settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin settings
kotlin.code.style=official

# KMP settings
kotlin.mpp.enableCInteropCommonization=true
# kotlin.native.cacheKind=none  ← REMOVED 2026-08-02, measured, keeping it off.
# Added incidentally in 8a20501 (an env-variants commit that never mentions
# caching), it disabled the Kotlin/Native compilation cache and recompiled every
# dependency — Compose included — on every link.
#   device link, incremental:  180s   → 58s
#   XCFramework, incremental:  ~360-420s → 70-100s
# The FIRST build after re-enabling is slower (~500s) while the cache is built,
# and again per target; only the third build shows the real number. Wiping
# ~/.konan or build/ pays that cost again. Do not re-add without measuring.
